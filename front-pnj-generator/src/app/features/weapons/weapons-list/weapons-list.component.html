<!--
  LISTE DES ARMES
  Affiche toutes les armes d'un univers sous forme de grille
-->

<div class="page-container">
  <!-- Header avec titre et bouton d'ajout -->
  <header class="page-header">
    <div class="page-info">
      <h1 class="page-title">Armes</h1>
      <p class="page-subtitle" *ngIf="weapons.length > 0">
        {{ weapons.length }} arme{{ weapons.length > 1 ? 's' : '' }} disponible{{ weapons.length > 1 ? 's' : '' }}
      </p>
    </div>
    <div class="page-actions">
      <button type="button" class="btn btn-primary" (click)="addWeapon()" *ngIf="weapons.length > 0">
        <i class="bi bi-plus-circle"></i>
        Ajouter une arme
      </button>
    </div>
  </header>

  <!-- Grille des armes -->
  <div class="items-grid" *ngIf="weapons.length > 0">
    <app-weapons-card *ngFor="let weapon of weapons"
                      [weapon]="weapon"
                      (edit)="goToEdit($event)"
                      (view)="goToDetail($event)"
                      (delete)="goToDelete($event)"
                      class="fade-in">
    </app-weapons-card>
  </div>

  <!-- État vide -->
  <div class="empty-state" *ngIf="weapons.length === 0 && !errorMessage">
    <div class="empty-icon"><i class="bi bi-crosshair"></i></div>
    <h3 class="empty-title">Aucune arme pour le moment</h3>
    <p class="empty-description">Commencez par créer votre première arme pour cet univers</p>
    <div class="empty-action">
      <button type="button" class="btn btn-primary" (click)="addWeapon()">
        <i class="bi bi-plus-circle"></i>
        Créer ma première arme
      </button>
    </div>
  </div>

  <!-- Message d'erreur -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <strong>Erreur :</strong> {{ errorMessage }}
  </div>
</div>
