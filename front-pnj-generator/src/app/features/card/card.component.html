<!--
  CARTE DE FEATURE
  Affiche une feature disponible (Armes, Équipements, etc.)
-->

<div class="feature-card card card-hover" (click)="onClick()">
  <div class="card-body">
    <!-- Titre simple -->
    <div class="feature-header">
      <h3 class="feature-title">{{ feature.title }}</h3>
    </div>

    <!-- Description -->
    <p class="feature-description">
      {{ feature.description }}
    </p>

    <!-- Action -->
    <div class="feature-action">
      <span class="btn-feature">
        Gérer
        <i class="bi bi-arrow-right"></i>
      </span>
    </div>
  </div>
</div>
