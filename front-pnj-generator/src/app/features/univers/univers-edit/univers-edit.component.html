<form class="card" [formGroup]="form" (ngSubmit)="save()">
  <div class="card-body">
    <h1 class="h5 text-white mb-3">
      {{ isEditMode ? 'Éditer un univers' : 'Créer un univers' }}
    </h1>

    <div class="mb-3">
      <label class="form-label">Nom</label>
      <input class="form-control" formControlName="name" />
      <div class="text-danger small mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
        Le nom est requis.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Époque</label>
      <input class="form-control" formControlName="era" />
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="4" formControlName="description"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Règle de dés</label>
      <input class="form-control" formControlName="diceRule" />
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
        Annuler
      </button>
      <button type="submit" class="btn btn-primary">
        Enregistrer
      </button>
    </div>
  </div>
</form>
