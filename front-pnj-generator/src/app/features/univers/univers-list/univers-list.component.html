<!--
  LISTE DES UNIVERS
  Page d'accueil affichant tous les univers
-->

<div class="universes-list-container">
  <!-- Header avec titre et bouton d'ajout -->
  <header class="page-header">
    <div>
      <h1 class="page-title">Mes Univers</h1>
      <p class="page-subtitle" *ngIf="universes.length > 0">
        {{ universes.length }} univers créé{{ universes.length > 1 ? 's' : '' }}
      </p>
    </div>
    <button type="button" class="btn btn-primary" (click)="addUniverse()">
      <i class="bi bi-plus-circle"></i>
      Créer un univers
    </button>
  </header>

  <!-- Grille des univers -->
  <div class="universes-grid" *ngIf="universes.length > 0">
    <app-univers-card *ngFor="let universe of universes"
                      [universe]="universe"
                      (edit)="goToEdit($event)"
                      (view)="goToDetail($event)"
                      (delete)="goToDelete($event)"
                      class="fade-in">
    </app-univers-card>
  </div>

  <!-- État vide -->
  <div class="empty-state" *ngIf="universes.length === 0 && !errorMessage">
    <div class="empty-icon">🌌</div>
    <h3>Aucun univers pour le moment</h3>
    <p>Créez votre premier univers pour commencer votre aventure</p>
    <button type="button" class="btn btn-primary mt-3" (click)="addUniverse()">
      <i class="bi bi-plus-circle"></i>
      Créer mon premier univers
    </button>
  </div>

  <!-- Message d'erreur -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <strong>Erreur :</strong> {{ errorMessage }}
  </div>
</div>
