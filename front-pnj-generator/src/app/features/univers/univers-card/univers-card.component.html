<!--
  CARTE D'UN UNIVERS
  Affiche un univers avec ses infos principales
-->

<div class="universe-card card card-hover" (click)="onView()">
  <div class="card-body">
    <!-- Header avec nom et badge règle de dés -->
    <div class="universe-header">
      <h3 class="universe-name">{{ universe.name }}</h3>
      <span class="badge badge-dice" *ngIf="universe.diceRule">
        🎲 {{ universe.diceRule }}
      </span>
    </div>

    <!-- Description -->
    <p class="universe-description" *ngIf="universe.description">
      {{ universe.description }}
    </p>

    <!-- Époque -->
    <div class="universe-meta" *ngIf="universe.era">
      <span class="meta-icon">📅</span>
      <div class="meta-content">
        <span class="meta-label">Époque</span>
        <span class="meta-value">{{ universe.era }}</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="universe-actions">
      <button type="button"
              class="btn btn-sm btn-outline-secondary"
              (click)="onEdit($event)"
              title="Modifier l'univers">
        <i class="bi bi-pencil"></i>
        Modifier
      </button>
      <button type="button"
              class="btn btn-sm btn-outline-danger"
              (click)="onDelete($event)"
              title="Supprimer l'univers">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>
</div>
