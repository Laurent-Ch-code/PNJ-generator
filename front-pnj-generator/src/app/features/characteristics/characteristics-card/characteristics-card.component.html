<!--
  CARTE D'UNE CARACTÉRISTIQUE
  Affiche les informations d'une caractéristique de manière compacte et élégante
-->

<div class="item-card card card-hover">
  <div class="card-body">

    <!-- Header : nom + badge modificateurs spécifiques si présents -->
    <div class="item-header">
      <h3 class="item-name">{{ characteristic.name }}</h3>
      <span class="badge badge-secondary" *ngIf="characteristic.hasModifiers">
        <i class="bi bi-sliders me-1"></i>
        Modificateurs
      </span>
    </div>

    <!-- Description si présente -->
    <p class="item-description" *ngIf="characteristic.description">
      {{ characteristic.description }}
    </p>

    <!-- Stats -->
    <div class="item-stats">

      <!-- Type de dé -->
      <div class="stat-item" *ngIf="characteristic.diceType">
        <span class="stat-icon"><i class="bi bi-dice-5"></i></span>
        <div class="stat-content">
          <span class="stat-label">Type de dé</span>
          <span class="stat-value">{{ characteristic.diceType }}</span>
        </div>
      </div>

      <!-- Jet de dés — affiché sous forme lisible ex: 2D6, 2-4D6 -->
      <div class="stat-item" *ngIf="characteristic.minDice">
        <span class="stat-icon"><i class="bi bi-hash"></i></span>
        <div class="stat-content">
          <span class="stat-label">Jet</span>
          <span class="stat-value" *ngIf="!characteristic.maxDice || characteristic.maxDice === characteristic.minDice">
            {{ characteristic.minDice }}{{ characteristic.diceType }}
          </span>
          <span class="stat-value" *ngIf="characteristic.maxDice && characteristic.maxDice !== characteristic.minDice">
            {{ characteristic.minDice }}-{{ characteristic.maxDice }}{{ characteristic.diceType }}
          </span>
        </div>
      </div>

    </div>

    <!-- Actions -->
    <div class="item-actions">
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onEdit()" title="Modifier">
        <i class="bi bi-pencil"></i>
        Modifier
      </button>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="onDelete()" title="Supprimer">
        <i class="bi bi-trash"></i>
      </button>
    </div>

  </div>
</div>
