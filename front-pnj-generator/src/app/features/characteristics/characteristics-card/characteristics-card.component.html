<!--
  CARTE D'UNE CARACTERISTIQUE
  Affiche les informations d'une characteristic de manière compacte et élégante
-->

<div class="item-card card card-hover">
  <div class="card-body">
    <!-- Header de la carte avec nom et badge du type -->
    <div class="item-header">
      <h3 class="item-name">{{ characteristic.name }}</h3>
    </div>

    <!-- Description si présente -->
    <p class="item-description" *ngIf="characteristic.description">
      {{ characteristic.description }}
    </p>

    <!-- Stats de l'characteristic en grille -->
    <div class="item-stats">
      <!-- Valeur -->
      <div class="stat-item" *ngIf="characteristic.value">
        <span class="stat-icon"><i class="bi bi-speedometer"></i></span>
        <div class="stat-content">
          <span class="stat-label">Valeur</span>
          <span class="stat-value">{{ characteristic.value }}</span>
        </div>
      </div>

      <!-- Modificateur -->
      <div class="stat-item" *ngIf="characteristic.modifier">
        <span class="stat-icon"><i class="bi bi-graph-up-arrow"></i></span>
        <div class="stat-content">
          <span class="stat-label">Modificateur</span>
          <span class="stat-value">{{ characteristic.modifier }}</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="item-actions">
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onEdit()" title="Modifier">
        <i class="bi bi-pencil"></i>
        Modifier
      </button>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="onDelete()" title="Supprimer">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>
</div>
