<!--
  LISTE DES EQUIPEMENTS
  Affiche toutes les équipements d'un univers sous forme de grille
-->

<div class="equipments-list-container">
  <!-- Header avec titre et bouton d'ajout -->
  <header class="page-header">
    <div>
      <h1 class="page-title">Equipements</h1>
      <p class="page-subtitle" *ngIf="equipments.length > 0">
        {{ equipments.length }} arme{{ equipments.length > 1 ? 's' : '' }} disponible{{ equipments.length > 1 ? 's' : '' }}
      </p>
    </div>
    <button type="button" class="btn btn-primary" (click)="addEquipment()">
      <i class="bi bi-plus-circle"></i>
      Ajouter un équipement
    </button>
  </header>

  <!-- Grille des armes -->
  <div class="equipments-grid" *ngIf="equipments.length > 0">
    <app-equipment-card *ngFor="let equipment of equipments"
                      [equipment]="equipment"
                      (edit)="goToEdit($event)"
                      (view)="goToDetail($event)"
                      (delete)="goToDelete($event)"
                      class="fade-in">
    </app-equipment-card>
  </div>

  <!-- État vide -->
  <div class="empty-state" *ngIf="equipments.length === 0 && !errorMessage">
    <div class="empty-icon">⚔️</div>
    <h3>Aucun équipement pour le moment</h3>
    <p>Commencez par créer votre premier équipement pour cet univers</p>
    <button type="button" class="btn btn-primary mt-3" (click)="addEquipment()">
      <i class="bi bi-plus-circle"></i>
      Créer mon premier équipement
    </button>
  </div>

  <!-- Message d'erreur -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <strong>Erreur :</strong> {{ errorMessage }}
  </div>
</div>
