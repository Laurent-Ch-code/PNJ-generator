<!--
  LISTE DES ARMES
  Affiche toutes les armes d'un univers sous forme de grille
-->

<div class="page-container">
  <!-- Header avec titre et bouton d'ajout -->
  <header class="page-header">
    <div class="page-info">
      <h1 class="page-title">Equipements</h1>
      <p class="page-subtitle" *ngIf="equipments.length > 0">
        {{ equipments.length }} équipement{{ equipments.length > 1 ? 's' : '' }} disponible{{ equipments.length > 1 ? 's' : '' }}
      </p>
    </div>
    <div class="page-actions">
      <button type="button" class="btn btn-primary" (click)="addEquipment()" *ngIf="equipments.length > 0">
        <i class="bi bi-plus-circle"></i>
        Ajouter un équipement
      </button>
    </div>
  </header>

  <!-- Grille des armes -->
  <div class="items-grid" *ngIf="equipments.length > 0">
    <app-equipment-card *ngFor="let equipment of equipments"
                      [equipment]="equipment"
                      (edit)="goToEdit($event)"
                      (view)="goToDetail($event)"
                      (delete)="goToDelete($event)"
                      class="fade-in">
    </app-equipment-card>
  </div>

  <!-- État vide -->
  <div class="empty-state" *ngIf="equipments.length === 0 && !errorMessage">
    <div class="empty-icon"><i class="bi bi-backpack"></i></div>
    <h3 class="empty-title">Aucun équipement pour le moment</h3>
    <p class="empty-description">Commencez par créer votre premier équipement pour cet univers</p>
    <div class="empty-action">
      <button type="button" class="btn btn-primary" (click)="addEquipment()">
        <i class="bi bi-plus-circle"></i>
        Créer mon premier équipement
      </button>
    </div>
  </div>

  <!-- Message d'erreur -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <strong>Erreur :</strong> {{ errorMessage }}
  </div>
</div>
