<!--
  CARTE D'UNE COMPETENCE
  Affiche les informations d'une skill de manière compacte et élégante
-->

<div class="item-card card card-hover">
  <div class="card-body">
    <!-- Header de la carte avec nom et badge du type -->
    <div class="item-header">
      <h3 class="item-name">{{ skill.name }}</h3>
      <span class="badge badge-secondary" *ngIf="skill.type">
        {{ skill.type }}
      </span>
    </div>

    <!-- Description si présente -->
    <p class="item-description" *ngIf="skill.description">
      {{ skill.description }}
    </p>

    <!-- Stats de l'skill en grille -->
    <div class="item-stats">
      <!-- Niveau d'armure -->
      <div class="stat-item" *ngIf="skill.value">
        <span class="stat-icon">💥</span>
        <div class="stat-content">
          <span class="stat-label">Valeur d'une caractéristique</span>
          <span class="stat-value">{{ skill.value }}</span>
        </div>
      </div>

      <!-- Matériaux -->
      <div class="stat-item" *ngIf="skill.modifier">
        <span class="stat-icon">🎯</span>
        <div class="stat-content">
          <span class="stat-label">Modificateur</span>
          <span class="stat-value">{{ skill.modifier }}</span>
        </div>
      </div>

    <!-- Actions -->
    <div class="item-actions">
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onView()" title="Voir les détails">
        <i class="bi bi-eye"></i>
        Voir
      </button>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onEdit()" title="Modifier">
        <i class="bi bi-pencil"></i>
        Modifier
      </button>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="onDelete()" title="Supprimer">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>
</div>
