<!--
  CARTE D'UNE COMPETENCE
  Affiche les informations d'une skill de manière compacte et élégante
-->

<div class="item-card card card-hover">
  <div class="card-body">
    <!-- Header de la carte avec nom -->
    <div class="item-header">
      <h3 class="item-name">{{ skill.name }}</h3>
    </div>

    <!-- Description si présente -->
    <p class="item-description" *ngIf="skill.description">
      {{ skill.description }}
    </p>

    <!-- Stats de l'skill en grille -->
    <div class="item-stats">
      <!-- Caractéristique liée -->
      <div class="stat-item" *ngIf="skill.relatedCharacteristic">
        <span class="stat-icon"><i class="bi bi-link-45deg"></i></span>
        <div class="stat-content">
          <span class="stat-label">Caractéristique liée</span>
          <span class="stat-value">{{ skill.relatedCharacteristic }}</span>
        </div>
      </div>

      <!-- Bonus -->
      <div class="stat-item" *ngIf="skill.bonus">
        <span class="stat-icon"><i class="bi bi-plus-circle-fill"></i></span>
        <div class="stat-content">
          <span class="stat-label">Bonus</span>
          <span class="stat-value">{{ skill.bonus }}</span>
        </div>
      </div>

      <!-- Malus -->
      <div class="stat-item" *ngIf="skill.malus">
        <span class="stat-icon"><i class="bi bi-dash-circle-fill"></i></span>
        <div class="stat-content">
          <span class="stat-label">Malus</span>
          <span class="stat-value">{{ skill.malus }}</span>
        </div>
      </div>

      <!-- Prérequis -->
      <div class="stat-item" *ngIf="skill.prerequisites">
        <span class="stat-icon"><i class="bi bi-info-circle"></i></span>
        <div class="stat-content">
          <span class="stat-label">Prérequis</span>
          <span class="stat-value">{{ skill.prerequisites }}</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="item-actions">
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onEdit()" title="Modifier">
        <i class="bi bi-pencil"></i>
        Modifier
      </button>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="onDelete()" title="Supprimer">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>
</div>
