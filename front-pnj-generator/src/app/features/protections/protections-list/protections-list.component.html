<!--
  LISTE DES PROTECTIONS
  Affiche toutes les protections d'un univers sous forme de grille
-->

<div class="page-container">
  <!-- Header avec titre et bouton d'ajout -->
  <header class="page-header">
    <div class="page-info">
      <h1 class="page-title">Protections</h1>
      <p class="page-subtitle" *ngIf="protections.length > 0">
        {{ protections.length }} protection{{ protections.length > 1 ? 's' : '' }} disponible{{ protections.length > 1 ? 's' : '' }}
      </p>
    </div>
    <div class="page-actions">
      <button type="button" class="btn btn-primary" (click)="addProtection()" *ngIf="protections.length > 0">
        <i class="bi bi-plus-circle"></i>
        Ajouter une protection
      </button>
    </div>
  </header>

  <!-- Grille des protections -->
  <div class="items-grid" *ngIf="protections.length > 0">
    <app-protections-card *ngFor="let protection of protections"
                      [protection]="protection"
                      (edit)="goToEdit($event)"
                      (view)="goToDetail($event)"
                      (delete)="goToDelete($event)"
                      class="fade-in">
    </app-protections-card>
  </div>

  <!-- État vide -->
  <div class="empty-state" *ngIf="protections.length === 0 && !errorMessage">
    <div class="empty-icon"><i class="bi bi-shield-fill"></i></div>
    <h3 class="empty-title">Aucune protection pour le moment</h3>
    <p class="empty-description">Commencez par créer votre première protection pour cet univers</p>
    <div class="empty-action">
      <button type="button" class="btn btn-primary" (click)="addProtection()">
        <i class="bi bi-plus-circle"></i>
        Créer ma première protection
      </button>
    </div>
  </div>

  <!-- Message d'erreur -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <strong>Erreur :</strong> {{ errorMessage }}
  </div>
</div>
