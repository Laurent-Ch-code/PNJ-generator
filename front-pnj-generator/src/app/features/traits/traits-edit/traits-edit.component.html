<!--
  FORMULAIRE D'ÉDITION DE TRAIT
  Création et modification d'une compétence
-->

<div class="form-container">
  <form [formGroup]="traitForm" (ngSubmit)="save()">

    <!-- Header du formulaire -->
    <header class="form-header">
      <h1 class="form-title">
        {{ isEditMode ? 'Modifier un trait' : 'Créer un trait' }}
      </h1>
      <p class="form-subtitle" *ngIf="universe">
        Pour la univers : <strong>{{ universe.name }}</strong>
      </p>
    </header>

    <!-- Card principale du formulaire -->
    <div class="card">
      <div class="card-body">

        <!-- Section : Informations de base -->
        <div class="form-section">
          <h2 class="section-title">
            <i class="bi bi-info-circle"></i>
            Informations de base
          </h2>

          <div class="row g-3">
            <!-- Nom (requis) -->
            <div class="col-12">
              <label class="form-label required">Nom du trait</label>
              <input type="text"
                     class="form-control"
                     formControlName="name"
                     placeholder="Ex: Insensible au feu, immortel, craint le soleil..."
                     [class.is-invalid]="traitForm.controls.name.touched && traitForm.controls.name.invalid" />
              <div class="invalid-feedback" *ngIf="traitForm.controls.name.touched && traitForm.controls.name.invalid">
                Le nom de la compétence est obligatoire
              </div>
            </div>

            <!-- Type -->
            <div class="col-md-6">
              <label class="form-label">Type</label>
              <input type="text"
                     class="form-control"
                     formControlName="type"
                     placeholder="Ex: Résistance, faiblesse..." />
              <small class="form-text">Type du trait</small>
            </div>

            <!-- Description -->
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control"
                        rows="4"
                        formControlName="description"
                        placeholder="Décrivez le trait, son histoire, ses particularités..."></textarea>
              <small class="form-text">Description détaillée (optionnelle)</small>
            </div>
          </div>
        </div>

        <!-- Section : Caractéristiques -->
        <div class="form-section">
          <h2 class="section-title">
            <i class="bi bi-bar-chart"></i>
            Caractéristiques
          </h2>

          <div class="row g-3">
            <!-- prérequis -->
            <div class="col-md-6">
              <label class="form-label">Prérequis du trait</label>
              <input type="text"
                     class="form-control"
                     formControlName="prerequisites"
                     placeholder="Ex: 10 en force, niveau 1 compétence et 2 en sagesse..." />
              <small class="form-text">Prérequis du trait</small>
            </div>
          </div>
        </div>

        <!-- Actions du formulaire -->
        <div class="form-actions">
          <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
            <i class="bi bi-x-circle"></i>
            Annuler
          </button>
          <button type="submit"
                  class="btn btn-primary"
                  [disabled]="traitForm.invalid || isSaving">
            <span *ngIf="!isSaving">
              <i class="bi bi-check-circle"></i>
              {{ isEditMode ? 'Enregistrer les modifications' : 'Créer le trait' }}
            </span>
            <span *ngIf="isSaving">
              <span class="spinner-border spinner-border-sm me-2"></span>
              Enregistrement...
            </span>
          </button>
        </div>

      </div>
    </div>
  </form>
</div>
