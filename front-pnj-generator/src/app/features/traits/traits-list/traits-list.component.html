<!--
  LISTE DES TRAITS
  Affiche toutes les traits d'un univers sous forme de grille
-->

<div class="page-container">
  <!-- Header avec titre et bouton d'ajout -->
  <header class="page-header">
    <div class="page-info">
      <h1 class="page-title">Traits</h1>
      <p class="page-subtitle" *ngIf="traits.length > 0">
        {{ traits.length }} trait{{ traits.length > 1 ? 's' : '' }} disponible{{ traits.length > 1 ? 's' : '' }}
      </p>
    </div>
    <div class="page-actions">
      <button type="button" class="btn btn-primary" (click)="addTrait()" *ngIf="traits.length > 0">
        <i class="bi bi-plus-circle"></i>
        Ajouter un trait
      </button>
    </div>
  </header>

  <!-- Grille des traits -->
  <div class="items-grid" *ngIf="traits.length > 0">
    <app-traits-card *ngFor="let trait of traits"
                     [trait]="trait"
                     (edit)="goToEdit($event)"
                     (delete)="goToDelete($event)"
                     class="fade-in">
    </app-traits-card>
  </div>

  <!-- État vide -->
  <div class="empty-state" *ngIf="traits.length === 0 && !errorMessage">
    <div class="empty-icon"><i class="bi bi-stars" style="font-size: 4rem;"></i></div>
    <h3 class="empty-title">Aucun trait pour le moment</h3>
    <p class="empty-description">Commencez par créer votre premier trait pour cet univers</p>
    <div class="empty-action">
      <button type="button" class="btn btn-primary" (click)="addTrait()">
        <i class="bi bi-plus-circle"></i>
        Créer mon premier trait
      </button>
    </div>
  </div>

  <!-- Message d'erreur -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <strong>Erreur :</strong> {{ errorMessage }}
  </div>
</div>
