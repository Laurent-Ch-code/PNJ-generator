<!--
  CARTE D'UN TRAIT
  Affiche les informations d'un trait de manière compacte et élégante
-->

<div class="item-card card card-hover">
  <div class="card-body">
    <!-- Header de la carte avec nom et badge du type -->
    <div class="item-header">
      <h3 class="item-name">{{ trait.name }}</h3>
      <span class="badge badge-secondary" *ngIf="trait.type">
        {{ trait.type }}
      </span>
    </div>

    <!-- Description si présente -->
    <p class="item-description" *ngIf="trait.description">
      {{ trait.description }}
    </p>

    <!-- Stats du trait en grille -->
    <div class="item-stats">
      <!-- Effet -->
      <div class="stat-item" *ngIf="trait.effect">
        <span class="stat-icon"><i class="bi bi-lightning-fill"></i></span>
        <div class="stat-content">
          <span class="stat-label">Effet</span>
          <span class="stat-value">{{ trait.effect }}</span>
        </div>
      </div>

      <!-- Prérequis -->
      <div class="stat-item" *ngIf="trait.prerequisites">
        <span class="stat-icon"><i class="bi bi-info-circle"></i></span>
        <div class="stat-content">
          <span class="stat-label">Prérequis</span>
          <span class="stat-value">{{ trait.prerequisites }}</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="item-actions">
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onView()" title="Voir les détails">
        <i class="bi bi-eye"></i>
        Voir
      </button>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onEdit()" title="Modifier">
        <i class="bi bi-pencil"></i>
        Modifier
      </button>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="onDelete()" title="Supprimer">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>
</div>
